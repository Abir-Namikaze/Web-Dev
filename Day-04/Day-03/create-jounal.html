<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Journal</title>
</head>
<body>
    <h1>Create Journal</h1>
    <form action="/api/v1/journals" method="post">
    <label for="title">Journal Title</label>
    <input id="title" type="text" name="title" placeholder="Enter title">

<br>
    <label for="dropdown">Journal Categort</label>
    <select name="dropdown" id="dropdown">
        <option value="idea">Idea</option>
        <option value="note">Note</option>
        <option value="goal">Goal</option>
        <option value="habit">Habti</option>
        <option value="memory">Memory</option>
        <option value="event">Event</option>
        <option value="mood">Mood</option>
        <option value="task">Task</option>
    </select>
<br>
    <label for="text">Journal Entry</label>
    <textarea name="journal area" id="textarea" rows="10" cols="20" placeholder="Enter here"></textarea>
<br>
    <button type="submit">Submit</button>
    </form>
</body>
</htm l>
